services:
  db:
    image: postgres:13.0-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file: .env
    restart: always

  backend:
    image: quantersly/foodgram_backend:latest
    restart: always
    command: >
      sh -c "mkdir -p /app/static/rest_framework/fonts/ &&
             cp data/arial.ttf /app/static/rest_framework/fonts/ ;
             python manage.py migrate &&
             gunicorn foodgram.wsgi:application --bind 0:8000"
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
    depends_on:
      - db
    env_file: .env

  frontend:
    image: quantersly/foodgram_frontend:latest
    restart: always
    volumes:
      - frontend_static:/app/build/

  nginx:
    image: nginx:1.21.3-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_static:/usr/share/nginx/html/
      - static_value:/app/static/:ro
      - media_value:/app/media/:ro
      # - /etc/letsencrypt/:/etc/letsencrypt/:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_value:
  media_value:
  frontend_static:
